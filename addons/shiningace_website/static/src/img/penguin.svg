<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Body -->
  <ellipse cx="50" cy="62" rx="28" ry="34" fill="#1C1C2E"/>
  <!-- White belly -->
  <ellipse cx="50" cy="68" rx="16" ry="22" fill="#FFFFFF"/>
  <!-- Head -->
  <circle cx="50" cy="30" r="22" fill="#1C1C2E"/>
  <!-- Face white -->
  <ellipse cx="50" cy="33" rx="14" ry="12" fill="#FFFFFF"/>
  <!-- Eyes -->
  <circle cx="44" cy="28" r="3.5" fill="#1C1C2E"/>
  <circle cx="56" cy="28" r="3.5" fill="#1C1C2E"/>
  <circle cx="45" cy="27" r="1" fill="#FFFFFF"/>
  <circle cx="57" cy="27" r="1" fill="#FFFFFF"/>
  <!-- Beak -->
  <ellipse cx="50" cy="36" rx="5" ry="3" fill="#F5A623"/>
  <!-- Graduation cap -->
  <rect x="30" y="10" width="40" height="5" rx="2" fill="#1C1C2E"/>
  <rect x="46" y="5" width="8" height="8" rx="1" fill="#1C1C2E"/>
  <line x1="70" y1="12" x2="75" y2="20" stroke="#F5A623" stroke-width="2"/>
  <circle cx="75" cy="22" r="3" fill="#F5A623"/>
  <!-- Wings -->
  <ellipse cx="22" cy="65" rx="10" ry="18" fill="#1C1C2E" transform="rotate(-15 22 65)"/>
  <ellipse cx="78" cy="65" rx="10" ry="18" fill="#1C1C2E" transform="rotate(15 78 65)"/>
  <!-- Feet -->
  <ellipse cx="40" cy="95" rx="10" ry="4" fill="#F5A623"/>
  <ellipse cx="60" cy="95" rx="10" ry="4" fill="#F5A623"/>
</svg>
